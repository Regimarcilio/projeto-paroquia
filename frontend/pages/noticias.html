<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias - Paróquia São Miguel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header"><div class="container"><nav class="nav-main"><a href="/" class="logo"><div class="logo-icon"><i class="fas fa-shield-alt"></i></div><div class="logo-text"><h1>São Miguel Arcanjo</h1><span>Paróquia Católica</span></div></a><ul class="nav-menu"><li><a href="/">Início</a></li><li><a href="/pages/sobre.html">A Paróquia</a></li><li><a href="/pages/horarios.html">Horários</a></li><li><a href="/pages/pastorais.html">Pastorais</a></li><li><a href="/pages/eventos.html">Eventos</a></li><li><a href="/pages/noticias.html">Notícias</a></li><li><a href="/pages/contato.html">Contato</a></li><li><a href="/pages/admin/login.html" class="btn-donate">Admin</a></li></ul></nav></div></header>

    <section class="page-header"><div class="container"><h1>Notícias da Paróquia</h1><p>Fique por dentro dos acontecimentos</p></div></section>

    <div class="container py-5"><div id="noticias-container" class="grid-4"></div></div>

    <footer class="footer"><div class="container"><div class="copyright">&copy; 2025 Paróquia São Miguel Arcanjo</div></div></footer>

    <script>
        fetch('/api/noticias/').then(r=>r.json()).then(data => {
            let html = '';
            data.forEach(n => {
                const dataFormatada = new Date(n.data_publicacao).toLocaleDateString('pt-BR');
                html += `<div class="card-minimal"><i class="fas fa-newspaper card-icon"></i><h4>${n.titulo}</h4><small>${dataFormatada}</small><p>${n.conteudo.substring(0, 150)}${n.conteudo.length > 150 ? '...' : ''}</p></div>`;
            });
            document.getElementById('noticias-container').innerHTML = html || '<p>Nenhuma notícia cadastrada.</p>';
        });
    </script>
    <style>.py-5{padding:80px 0}</style>
</body>
</html>
