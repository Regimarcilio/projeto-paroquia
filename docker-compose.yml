services:
  backend:
    build: ./backend
    container_name: paroquia_backend
    restart: always
    environment:
      DATABASE_URL: "sqlite:/app/data/paroquia.db"
      JWT_SECRET: paroquia-secret-key-2024
      PORT: 8002
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_data:/app/data
    networks:
      - paroquia_network

  nginx:
    image: nginx:alpine
    container_name: paroquia_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - paroquia_network
    depends_on:
      - backend

volumes:
  backend_data:

networks:
  paroquia_network:
    driver: bridge
